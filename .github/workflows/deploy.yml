name: Deploy to GitHub Pages

# TEMPORARY: Blobz borrows the Pages host. Pushes to the Blobz branch deploy
# Blobz at /Game/, Asset Report main at /Game/asset-report/ and dev at /Game/dev/.
# A push to main/dev runs THEIR copy of this workflow and restores the old layout.
on:
  push:
    branches:
      - main
      - dev
      - claude/mobile-game-5-players-8qthjq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blobz (this commit)
        uses: actions/checkout@v4
        with:
          path: blobz-src

      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Blobz -> site root (/Game/)
        working-directory: blobz-src/blobz
        run: |
          npm ci
          npm run build

      - name: Build main -> /Game/asset-report/
        working-directory: main/web
        run: |
          npm ci
          npm run build -- --base=/Game/asset-report/

      - name: Build dev -> site/dev (/Game/dev/)
        working-directory: dev/web
        run: |
          npm ci
          npm run build -- --base=/Game/dev/

      - name: Assemble combined site
        run: |
          mkdir -p site site/asset-report
          cp -r blobz-src/blobz/dist/. site/
          cp -r main/web/dist/. site/asset-report/
          mkdir -p site/dev
          cp -r dev/web/dist/. site/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

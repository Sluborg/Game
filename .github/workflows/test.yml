name: Web tests

# Runs the vitest suite (incl. the content-pipeline schema gate) so a bad content
# drop fails CI. deploy.yml only builds (tsc + vite) and runs post-merge, so
# without this job the schema test would never gate a PR.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    name: vitest (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (catches vocabulary/type regressions at PR time)
        run: npx tsc -b

      - name: Run tests
        run: npm run test

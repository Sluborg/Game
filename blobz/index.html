<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b6b3a" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Blobz</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <canvas id="intro-bg"></canvas>

    <!-- Menu -->
    <section id="menu" class="screen">
      <div class="card">
        <h1 class="logo" id="logo" aria-label="Blobz">Blobz</h1>
        <p class="tag">Samla, bygg och samarbeta, 1-5 spelare</p>
        <canvas id="preview" width="120" height="120"></canvas>
        <input id="name" maxlength="10" placeholder="Ditt namn" autocomplete="off" />
        <div id="colors" class="row"></div>
        <div id="hats" class="row"></div>
        <button id="btn-host" class="big">Skapa rum</button>
        <div class="join">
          <input id="code" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" />
          <button id="btn-join" class="big alt">Gå med</button>
        </div>
        <p id="menu-msg" class="msg"></p>
      </div>
    </section>

    <!-- Lobby -->
    <section id="lobby" class="screen hidden">
      <div class="card">
        <p class="tag">Rumskod</p>
        <div id="lobby-code" class="code" aria-live="polite">----</div>
        <p class="tag small">Alla på samma Wi-Fi: öppna Blobz och skriv koden</p>
        <ul id="lobby-list"></ul>
        <button id="btn-start" class="big">Starta!</button>
        <p id="lobby-wait" class="msg">Väntar på att värden startar...</p>
        <button id="btn-leave" class="link">Lämna</button>
      </div>
    </section>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-code"></div>
      <div id="hud-score"><span id="score">0</span><div id="starbar"><div id="starfill"></div><i class="s1"></i><i class="s2"></i><i class="s3"></i></div></div>
      <div id="hud-time">3:00</div>
      <div id="stick"><div id="knob"></div></div>
      <button id="dash" aria-label="Fart"></button>
      <div id="hint">Dra för att åka · <span id="hint-dash"></span> för fart · Krocka i träd för ved · Bär kistor tillsammans!</div>
    </div>

    <!-- End -->
    <section id="end" class="screen hidden">
      <div class="card">
        <h2>Bra jobbat!</h2>
        <div id="end-stars" class="stars"></div>
        <p id="end-score" class="tag"></p>
        <button id="btn-again" class="big">Spela igen</button>
        <p id="end-wait" class="msg">Väntar på värden...</p>
        <button id="btn-menu" class="link">Till menyn</button>
      </div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobz · Beetle Berry Run</title><style>
:root{background:#1a2022;color:#fff7e6;font:17px/1.4 system-ui;--panel:#30383a;--edge:#7f8b88}*{box-sizing:border-box}body{margin:auto;max-width:38rem;padding:1rem}h1{font-size:1.7rem}.panel{padding:.8rem;margin:.7rem 0;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}
button{min-height:46px;margin:.25rem;padding:.55rem;font:inherit;color:inherit;background:#455254;border:1px solid #93a09d;border-radius:.45rem}button:disabled{opacity:.45}button[aria-pressed=true]{outline:3px solid #ffc93c;background:#67513e}.roles{display:grid;gap:.6rem}@media(min-width:32rem){.roles{grid-template-columns:1fr 1fr}}.targets{display:flex;gap:.7rem}.target{flex:1;padding:.7rem;text-align:center;background:#463b34;border:3px solid #3f2631;border-radius:.5rem}.filled{background:#6cbf45;color:#17241a}.status{min-height:3.2rem}
</style><h1>Beetle Berry Run</h1><p>Aim the reed chute. Shape the clay bank. Predict where the giant berry will land.</p>
<div class="targets"><div id="garden" class="target">Cottage garden<br>waiting</div><div id="shade" class="target">Shady leaf bed<br>waiting</div></div>
<div class="roles"><section class="panel"><h2>Reed keeper</h2><button id="garden-aim">Aim toward garden</button><button id="shade-aim">Aim toward shade</button></section><section class="panel"><h2>Clay shaper</h2><button id="low">Low channel</button><button id="high-shape">High pocket</button></section></div>
<p id="status" class="status" aria-live="polite">Choose one chute direction and one clay shape.</p><button id="launch" disabled>Launch berry</button><button id="reset-shot">Reset choices</button><button id="reset-all">Reset study project</button>
<script>
const $=id=>document.getElementById(id);let side="",shape="",done=false,notice="";
try{const raw=JSON.parse(localStorage.getItem("blobz-beetle-run-v1")||"{}");done=raw.done===true}catch{}
function save(){try{localStorage.setItem("blobz-beetle-run-v1",JSON.stringify({done}));notice=""}catch{notice=" This progress will last only for this visit."}}
function draw(){$("garden-aim").setAttribute("aria-pressed",String(side==="garden"));$("shade-aim").setAttribute("aria-pressed",String(side==="shade"));$("low").setAttribute("aria-pressed",String(shape==="low"));$("high-shape").setAttribute("aria-pressed",String(shape==="high"));$("launch").disabled=!side||!shape;$("garden").className="target"+(done?" filled":"");$("garden").innerHTML="Cottage garden<br>"+(done?"beetle visitor":"waiting");$("shade").className="target";$("shade").innerHTML="Shady leaf bed<br>waiting"}
function choose(kind,value){if(kind==="side")side=value;else shape=value;$("status").textContent="Ready. Tell your partner where you think the berry will go.";draw()}
$("garden-aim").onclick=()=>choose("side","garden");$("shade-aim").onclick=()=>choose("side","shade");$("low").onclick=()=>choose("shape","low");$("high-shape").onclick=()=>choose("shape","high");
$("launch").onclick=()=>{let message;if(side==="garden"&&shape==="low"){done=true;message="Success! The berry rolls to the garden and the beetle follows the scent trail."}else if(side==="garden"){message="The high pocket catches the berry. The beetle peers over the bank."}else if(shape==="low"){message="The berry rolls into the shade. The beetle follows it, then walks home."}else{message="The berry rests by the burrow. The beetle pauses beside it."}save();$("status").textContent=message+notice;draw()};
$("reset-shot").onclick=()=>{side="";shape="";$("status").textContent="Choose one chute direction and one clay shape.";draw()};$("reset-all").onclick=()=>{side="";shape="";done=false;notice="";try{localStorage.removeItem("blobz-beetle-run-v1")}catch{}$("status").textContent="Choose one chute direction and one clay shape.";draw()};draw();
</script></html>

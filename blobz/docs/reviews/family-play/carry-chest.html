<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobz · First shared chest</title><style>
:root{background:#182027;color:#fff7e6;font:17px/1.4 system-ui;--panel:#2c3740;--edge:#768995;--blue:#5ec8ff;--orange:#ff8a3d}*{box-sizing:border-box}body{margin:auto;max-width:42rem;padding:1rem}h1{font-size:1.7rem}.roles{display:grid;gap:.65rem}@media(min-width:34rem){.roles{grid-template-columns:1fr 1fr}}.panel{padding:.8rem;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}button{min-height:46px;margin:.2rem;padding:.5rem;font:inherit;color:inherit;background:#40515d;border:1px solid #8fa2ad;border-radius:.45rem}button[aria-pressed=true]{outline:3px solid #ffc93c;background:#625748}button:disabled{opacity:.45}.scene{position:relative;height:10rem;margin:.8rem 0;background:#3d5b43;border:3px solid #3f2631;border-radius:.6rem;overflow:hidden}.home{position:absolute;left:.4rem;top:.4rem;padding:.2rem .4rem;background:#725338}.chest{position:absolute;top:5.7rem;transform:translateX(-50%);font-size:2rem;transition:left .2s}.blob{position:absolute;top:7.2rem;width:2.4rem;height:1.7rem;border:3px solid #3f2631;border-radius:55% 55% 35% 35%;transform:translateX(-50%)}#blue{background:var(--blue);left:45%}#orange{background:var(--orange);left:70%}.called::after{content:"←";position:absolute;left:-1.5rem;top:-.7rem;color:#fff7e6;font-size:1.5rem;animation:pulse .6s steps(2) infinite}.pips{position:absolute;top:3.2rem;transform:translateX(-50%);display:flex;gap:.35rem}.pip{width:1rem;height:1rem;border:2px solid #3f2631;border-radius:50%;background:#57616a;opacity:.55}.pip.lit{opacity:1}.moving{filter:drop-shadow(0 0 0 #ffc93c)}@keyframes pulse{50%{transform:translateX(-.35rem)}}@media(prefers-reduced-motion:reduce){.called::after{animation:none}}.status{min-height:3rem}.controls{display:flex;flex-wrap:wrap;gap:.2rem}
</style><h1>First shared chest</h1><p>Two blobz steer the same chest. Bring both into its ring, choose directions and advance one movement beat.</p>
<div class="scene"><span class="home">Cottage</span><div id="pips" class="pips"><span id="pip-blue" class="pip"></span><span id="pip-orange" class="pip"></span></div><div id="chest" class="chest">▣</div><div id="blue" class="blob" aria-label="Blue blob"></div><div id="orange" class="blob" aria-label="Orange blob"></div></div>
<div class="roles"><section class="panel"><h2>Blue</h2><div class="controls"><button id="blue-in">Enter ring</button><button id="blue-out">Leave ring</button></div><div class="controls"><button id="blue-left">Toward home</button><button id="blue-stop">Stay</button><button id="blue-right">Away</button></div></section><section class="panel"><h2>Orange</h2><div class="controls"><button id="orange-in">Enter ring</button><button id="orange-out">Leave ring</button></div><div class="controls"><button id="orange-left">Toward home</button><button id="orange-stop">Stay</button><button id="orange-right">Away</button></div></section></div>
<p id="status" class="status" aria-live="polite"></p><button id="advance">Advance movement beat</button><button id="reset">Reset study</button>
<script>
const $=id=>document.getElementById(id);const players={blue:{near:true,dir:0},orange:{near:false,dir:0}};let step=3,delivered=false;
function name(id){return id[0].toUpperCase()+id.slice(1)}
function draw(message=""){const near=Object.keys(players).filter(id=>players[id].near);for(const id of Object.keys(players)){const p=players[id];$("pip-"+id).className="pip"+(p.near?" lit":"");$("pip-"+id).style.background=p.near?`var(--${id})`:"";$(id).className="blob"+(near.length===1&&!p.near?" called":"");$(id+"-in").setAttribute("aria-pressed",String(p.near));$(id+"-out").setAttribute("aria-pressed",String(!p.near));for(const [key,value] of [["left",-1],["stop",0],["right",1]])$(id+"-"+key).setAttribute("aria-pressed",String(p.dir===value))}const left=12+step*19;$("chest").style.left=left+"%";$("pips").style.left=left+"%";$("chest").className="chest"+(near.length>=2?" moving":"");$("advance").disabled=delivered;if(message)$("status").textContent=message;else if(near.length===1)$("status").textContent=name(Object.keys(players).find(id=>!players[id].near))+" needs to come closer.";else if(!near.length)$("status").textContent="The chest waits for two helpers.";else $("status").textContent="Both helper pips are lit. Choose directions."}
function setNear(id,value){if(delivered)return;players[id].near=value;draw()}
function setDir(id,value){if(delivered)return;players[id].dir=value;draw()}
for(const id of Object.keys(players)){$(id+"-in").onclick=()=>setNear(id,true);$(id+"-out").onclick=()=>setNear(id,false);$(id+"-left").onclick=()=>setDir(id,-1);$(id+"-stop").onclick=()=>setDir(id,0);$(id+"-right").onclick=()=>setDir(id,1)}
$("advance").onclick=()=>{const near=Object.keys(players).filter(id=>players[id].near);if(near.length<2){draw(near.length===1?name(Object.keys(players).find(id=>!players[id].near))+" is outside the ring. The chest brakes safely.":"Nobody is close enough. The chest stays put.");return}const sum=near.reduce((n,id)=>n+players[id].dir,0);if(sum<0)step=Math.max(0,step-1);else if(sum>0)step=Math.min(4,step+1);if(step===0){delivered=true;draw("Delivered together: +2 wood and +2 berries. Normal meadow chests can now appear.");return}draw(sum===0?"The movement averages to zero. The chest holds position.":sum<0?"The chest moves toward the cottage.":"The chest moves away from the cottage.")};
$("reset").onclick=()=>{players.blue.near=true;players.blue.dir=0;players.orange.near=false;players.orange.dir=0;step=3;delivered=false;draw()};draw();
</script></html>

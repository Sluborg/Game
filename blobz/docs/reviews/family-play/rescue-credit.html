<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobz · Rescue credit</title><style>
:root{background:#182027;color:#fff7e6;font:17px/1.4 system-ui;--panel:#2c3740;--edge:#768995;--heal:#78d7a2;--tank:#ff8a3d}*{box-sizing:border-box}body{margin:auto;max-width:42rem;padding:1rem}h1{font-size:1.7rem}.views{display:grid;gap:.65rem}@media(min-width:34rem){.views{grid-template-columns:1fr 1fr}}.panel{padding:.8rem;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}.arena{position:relative;height:8rem;margin:.7rem 0;background:#211929;border:2px solid #59445f;border-radius:.5rem}.blob{position:absolute;bottom:1.2rem;width:2.5rem;height:2rem;border:3px solid #3f2631;border-radius:55% 55% 35% 35%}.healer{left:18%;background:var(--heal)}.tank{right:18%;background:var(--tank)}.down{height:.8rem;border-radius:50%;filter:grayscale(.4)}.link{position:absolute;left:31%;right:31%;bottom:2.2rem;border-top:4px dotted #ff8aa0}.link::after{content:"♥";position:absolute;left:50%;top:-1.2rem;color:#ff8aa0}.banner{min-height:3rem;padding:.4rem;background:#3b3047;border-radius:.35rem;font-weight:750}.bar{height:.8rem;background:#17131b;border:1px solid #fff7e6}.bar i{display:block;height:100%;background:#e86060}.controls{display:flex;flex-wrap:wrap;gap:.25rem}button{min-height:46px;margin:.15rem;padding:.5rem;font:inherit;color:inherit;background:#40515d;border:1px solid #8fa2ad;border-radius:.45rem}button:disabled{opacity:.45}button[aria-pressed=true]{outline:3px solid #ffc93c}.status{min-height:2.5rem}
</style><h1>Who helped whom?</h1><div class="arena"><div id="healer" class="blob healer"></div><div id="link" class="link" hidden></div><div id="tank" class="blob tank"></div></div><p>Tank health</p><div class="bar"><i id="hp"></i></div>
<div class="views"><section class="panel"><h2>Healer view</h2><p id="healer-line" class="banner" aria-live="polite"></p></section><section class="panel"><h2>Tank view</h2><p id="tank-line" class="banner" aria-live="polite"></p></section></div>
<p id="status" class="status"></p><div class="controls"><button id="ko">Knock out Tank</button><button id="mode">Switch wand to heal</button><button id="bolt">Advance automatic heal bolt</button><button id="wait">Wait one second</button><button id="reset">Reset</button></div>
<script>
const $=id=>document.getElementById(id);let hp=140,ko=0,healMode=false,rescued=false;
function draw(){$("hp").style.width=(hp/140*100)+"%";$("tank").className="blob tank"+(ko>0?" down":"");$("mode").setAttribute("aria-pressed",String(healMode));$("bolt").disabled=!healMode||ko<=0;$("wait").disabled=ko<=0;$("link").hidden=!rescued}
function lines(healer,tank,status){$("healer-line").textContent=healer;$("tank-line").textContent=tank;$("status").textContent=status}
$("ko").onclick=()=>{hp=0;ko=5;rescued=false;lines("Tank is down. Switch to heal mode.","Down: 5 seconds. A heal bolt can wake you.","Automatic recovery is counting down.");draw()};
$("mode").onclick=()=>{healMode=!healMode;lines(healMode?"Heal mode ready.":"Attack mode ready.",ko>0?"Waiting for help or the countdown.":"Standing.",healMode?"The wand will target a knocked-out friend first.":"The wand targets enemies.");draw()};
$("bolt").onclick=()=>{if(!healMode||ko<=0)return;hp=70;ko=0;rescued=true;lines("You helped Tank up","Healer helped you up","Tank returns at 70 / 140 HP with 1.5 seconds of protection.");draw()};
$("wait").onclick=()=>{if(ko<=0)return;ko--;if(ko<=0){hp=140;rescued=false;lines("Tank got back up.","You got back up at the room entrance.","Automatic recovery has no rescuer credit.")}else lines("Tank is still down.","Down: "+ko+" seconds.","A heal bolt can still rescue Tank now.");draw()};
$("reset").onclick=()=>{hp=140;ko=0;healMode=false;rescued=false;lines("Ready.","Ready.","Knock out Tank to compare rescue and recovery.");draw()};$("reset").onclick();
</script></html>

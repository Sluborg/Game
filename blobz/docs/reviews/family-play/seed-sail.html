<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobz · Seed Sail</title><style>
:root{background:#182027;color:#fff7e6;font:17px/1.4 system-ui;--panel:#2c3740;--edge:#768995}*{box-sizing:border-box}body{margin:auto;max-width:38rem;padding:1rem}h1{font-size:1.7rem}.panel{padding:.8rem;margin:.7rem 0;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}
button{min-height:46px;margin:.25rem;padding:.55rem;font:inherit;color:inherit;background:#40515d;border:1px solid #8fa2ad;border-radius:.45rem}button:disabled{opacity:.45}button[aria-pressed=true]{outline:3px solid #ffc93c;background:#625748}.roles{display:grid;gap:.6rem}@media(min-width:32rem){.roles{grid-template-columns:1fr 1fr}}.landings{display:flex;gap:.7rem}.landing{flex:1;padding:.7rem;text-align:center;background:#3d4c43;border:3px solid #3f2631;border-radius:.5rem}.flower{background:#ff6b8b;color:#311827}.status{min-height:3.2rem}
</style><h1>Seed Sail</h1><p>Choose where the shortcut should grow. Light a nearby destination beacon, launch, then trim the reed sail before the marked bend.</p>
<div class="landings"><div id="cottage" class="landing">Cottage route</div><div id="pool" class="landing">Reed-pool route</div></div>
<div class="roles"><section class="panel"><h2>Glow keeper</h2><button id="cottage-beacon">Light cottage beacon</button><button id="pool-beacon">Light pool beacon</button><p id="ribbon">No wind ribbon is visible.</p></section>
<section class="panel"><h2>Reed sailor</h2><button id="tail">Trim for tailwind</button><button id="cross">Trim for crosswind</button></section></div>
<p id="status" class="status" aria-live="polite">Choose a beacon. You may pre-trim the sail.</p><button id="launch" disabled>Launch seedpod</button><button id="bend" disabled>Cross marked bend</button><button id="plant" disabled>Plant here</button><button id="return" disabled>Return seed</button><button id="reset-shot">Reset attempt</button><button id="reset-all">Reset study village</button>
<script>
const $=id=>document.getElementById(id);let beacon="",sail="",flower="",phase="ready",landed="",notice="";
try{const raw=JSON.parse(localStorage.getItem("blobz-seed-sail-v1")||"{}");flower=["cottage","pool"].includes(raw.flower)?raw.flower:""}catch{}
function save(){try{localStorage.setItem("blobz-seed-sail-v1",JSON.stringify({flower}));notice=""}catch{notice=" This shortcut will last only for this visit."}}
function draw(){for(const id of ["cottage","pool"]){$(id).className="landing"+(flower===id?" flower":"")} $("cottage-beacon").setAttribute("aria-pressed",String(beacon==="cottage"));$("pool-beacon").setAttribute("aria-pressed",String(beacon==="pool"));$("tail").setAttribute("aria-pressed",String(sail==="tail"));$("cross").setAttribute("aria-pressed",String(sail==="cross"));$("cottage-beacon").disabled=phase!=="ready";$("pool-beacon").disabled=phase!=="ready";$("tail").disabled=phase==="landed";$("cross").disabled=phase==="landed";$("launch").disabled=phase!=="ready"||!beacon;$("bend").disabled=phase!=="flight";$("plant").disabled=phase!=="landed"||!!flower;$("return").disabled=phase!=="landed"}
function setBeacon(value){if(phase!=="ready")return;beacon=value;$("ribbon").textContent=value==="cottage"?"A straight tailwind ribbon points toward the cottage route.":"A bent crosswind ribbon curls toward the pool route.";$("status").textContent="Tell the sailor which ribbon you see, then launch.";draw()}
function setSail(value){if(phase==="landed")return;sail=value;$("status").textContent=phase==="flight"?"Trim changed. Cross the bend to sample it.":"Sail pre-trimmed. Launch when the light keeper is ready.";draw()}
function ready(message){phase="ready";landed="";$("status").textContent=message;draw()}
$("cottage-beacon").onclick=()=>setBeacon("cottage");$("pool-beacon").onclick=()=>setBeacon("pool");$("tail").onclick=()=>setSail("tail");$("cross").onclick=()=>setSail("cross");
$("launch").onclick=()=>{phase="flight";$("status").textContent="Seed airborne! Trim the sail, then cross the marked bend.";draw()};
$("bend").onclick=()=>{const match=beacon==="cottage"&&sail==="tail"||beacon==="pool"&&sail==="cross";if(match){phase="landed";landed=beacon;$("status").textContent="Clean "+beacon+" landing. Plant this route or return the seed?";draw()}else if(beacon==="cottage")ready("The crosswind trim loops softly home. Keep the beacon and change one setting.");else ready("The tailwind trim overshoots into the eddy and returns. Keep the settings for a one-change retry.")};
$("plant").onclick=()=>{if(phase!=="landed"||flower)return;flower=landed;save();ready("The flower opens into the permanent "+flower+" shortcut!"+notice)};
$("return").onclick=()=>{if(phase!=="landed")return;ready("Seed returned. The permanent flower stays "+(flower?"at "+flower+".":"unplanted."))};
$("reset-shot").onclick=()=>{beacon="";sail="";phase="ready";landed="";$("ribbon").textContent="No wind ribbon is visible.";$("status").textContent="Choose a beacon. You may pre-trim the sail.";draw()};$("reset-all").onclick=()=>{beacon="";sail="";flower="";phase="ready";landed="";notice="";try{localStorage.removeItem("blobz-seed-sail-v1")}catch{}$("ribbon").textContent="No wind ribbon is visible.";$("status").textContent="Choose a beacon. You may pre-trim the sail.";draw()};draw();
</script></html>

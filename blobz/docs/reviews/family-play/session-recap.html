<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blobz · Session recap</title><style>
:root{background:#182027;color:#fff7e6;font:17px/1.4 system-ui;--panel:#2c3740;--edge:#768995}*{box-sizing:border-box}body{margin:auto;max-width:42rem;padding:1rem}h1{font-size:1.7rem}.panel{padding:.8rem;margin:.7rem 0;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}.controls{display:flex;flex-wrap:wrap;gap:.25rem}button{min-height:46px;margin:.15rem;padding:.5rem;font:inherit;color:inherit;background:#40515d;border:1px solid #8fa2ad;border-radius:.45rem}button:disabled{opacity:.45}.recap{background:#f4ead5;color:#3f2631;border:4px solid #7a4d32;text-align:center}.recap h2{margin:.2rem;font-size:1.45rem}.support{min-height:1.5rem}.stars{color:#d99a18;letter-spacing:.3rem;font-size:1.7rem}.next{padding:.55rem;background:#d9edb7;border:2px solid #3f2631;border-radius:.4rem;font-weight:750}.empty{display:none}.status{min-height:2.5rem}
</style><h1>Remember what changed</h1><p>Add events in their real order, then choose Save and go home.</p>
<section id="actions" class="panel"><div class="controls"><button id="build">Build Storage</button><button id="room">Reach room 5</button><button id="pin">Pin Seed Sail</button><button id="flower">Plant bridge flower</button><button id="milestone">Earn milestone</button></div><p id="status" class="status">No session events yet.</p><button id="home">Save and go home</button><button id="reset">Reset study</button></section>
<section id="recap" class="panel recap" hidden><p>Today</p><h2 id="headline"></h2><p id="support" class="support"></p><p id="stars" class="stars" aria-label="Earned milestones"></p><p id="next" class="next"></p><details><summary>Session details</summary><p>6 / 10 wood · 0 / 5 berries</p></details></section>
<script>
const $=id=>document.getElementById(id);let events=[],deepest=0,project="",goals=0,ended=false;const messages={storage:"Built Storage · carry 4 now",flower:"Flower planted by the bridge"};
function add(id){if(ended)return;events.push(id);$("status").textContent=messages[id]+" recorded."}
function draw(){for(const id of ["build","room","pin","flower","milestone","home"])$(id).disabled=ended;$("recap").hidden=!ended;if(!ended)return;const latest=events.at(-1);$("headline").textContent=latest?messages[latest]:deepest?"Reached dungeon room "+deepest:"Came home together";$("support").textContent=deepest&&latest?"Deepest dungeon room: "+deepest:"";$("stars").textContent="★".repeat(Math.min(3,goals));$("stars").className=goals?"stars":"stars empty";$("next").textContent=project?"Next outing: "+project:deepest&&deepest<10?"Next: dungeon room "+(deepest+1):"Next: choose an outing at the cottage"}
$("build").onclick=()=>add("storage");$("flower").onclick=()=>add("flower");$("room").onclick=()=>{if(ended)return;deepest=Math.max(deepest,5);$("status").textContent="Dungeon room 5 remembered after returning to the meadow."};$("pin").onclick=()=>{if(ended)return;project="Seed Sail";$("status").textContent="Seed Sail pinned for next time."};$("milestone").onclick=()=>{if(ended)return;goals++;$("status").textContent="Milestone "+goals+" earned."};$("home").onclick=()=>{ended=true;draw()};$("reset").onclick=()=>{events=[];deepest=0;project="";goals=0;ended=false;$("status").textContent="No session events yet.";draw()};draw();
</script></html>

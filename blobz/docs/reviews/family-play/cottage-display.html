<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blobz · Cottage discoveries</title><style>
:root{background:#1d2028;color:#fff7e6;font:17px/1.4 system-ui;--panel:#303440;--edge:#7d8391}*{box-sizing:border-box}body{margin:auto;max-width:38rem;padding:1rem}h1{font-size:1.7rem;margin:.2rem 0}.panel{margin:.7rem 0;padding:.8rem;background:var(--panel);border:1px solid var(--edge);border-radius:.7rem}
button{min-height:46px;margin:.25rem;padding:.55rem;font:inherit;color:inherit;background:#454c5c;border:1px solid #929aab;border-radius:.45rem}button:disabled{opacity:.42}button[aria-pressed=true]{outline:3px solid #ffc93c;background:#5a5137}
.shelf{display:flex;gap:1rem;justify-content:center;padding:.8rem;background:#6d4935;border:4px solid #3f2631}.token{width:52px;height:52px;padding:0;background:#594331;border:2px solid #3f2631}.token canvas{display:block;width:48px;height:48px;image-rendering:pixelated}.locked{filter:grayscale(1) brightness(.28)}.token[aria-pressed=true]{outline:3px solid #ffc93c}
.actions{display:flex;flex-wrap:wrap}.projects{display:grid;gap:.5rem}.projects button{text-align:left}.status{min-height:3.2rem}small{display:block;color:#ddd}
</style><h1>Cottage discoveries</h1><p>The shelf remembers what your family changed in the meadow.</p>
<section class="panel"><div class="shelf"><button id="reed" class="token locked" aria-label="Unknown discovery"><canvas width="24" height="24"></canvas></button><button id="clay" class="token locked" aria-label="Unknown discovery"><canvas width="24" height="24"></canvas></button><button id="glow" class="token locked" aria-label="Unknown discovery"><canvas width="24" height="24"></canvas></button></div><p id="recap" class="status" aria-live="polite">The shelf is waiting for its first discovery.</p></section>
<section class="panel"><h2>Study controls · return from an outing</h2><div class="actions"><button id="find-reed">Plant flower</button><button id="find-clay" disabled>Ring seed bell</button><button id="find-glow" disabled>Find picnic</button></div></section>
<section id="project-panel" class="panel" hidden><h2>What should we make next?</h2><div class="projects"><button data-project="sail">Seed sail <small>Reed + Glow</small></button><button data-project="lantern">Lantern stepping stones <small>Clay + Glow</small></button><button data-project="beetle">Beetle berry run <small>Reed + Clay</small></button></div><p id="project-status" class="status">Choose one outing. The others stay available.</p></section>
<button id="reset">Reset study village</button>
<script>
const $=id=>document.getElementById(id),order=["reed","clay","glow"],messages={reed:"Flower planted. Clay tracks have appeared.",clay:"Seed bell ringing. Pale spores lead into the dark.",glow:"Picnic clearing found. Three return projects are ready."},ingredients={sail:["reed","glow"],lantern:["clay","glow"],beetle:["reed","clay"]};let found=[],project="",notice="";
try{const raw=JSON.parse(localStorage.getItem("blobz-cottage-study-v1")||"{}"),list=Array.isArray(raw.found)?raw.found:[];let count=0;while(count<order.length&&list.includes(order[count]))count++;found=order.slice(0,count);project=found.length===3&&["sail","lantern","beetle"].includes(raw.project)?raw.project:""}catch{}
function paintTokens(){if(typeof Image==="undefined")return;const image=new Image;image.onload=()=>order.forEach((id,i)=>{const c=$(id).querySelector("canvas"),x=c.getContext("2d");x.clearRect(0,0,24,24);x.drawImage(image,24+i*48,0,24,24,0,0,24,24);const p=x.getImageData(0,0,24,24);for(let n=0;n<p.data.length;n+=4)if(p.data[n]===255&&p.data[n+1]===0&&p.data[n+2]===255)p.data[n+3]=0;x.putImageData(p,0,0)});image.src="art/discovery-tokens.png"}
function save(){try{localStorage.setItem("blobz-cottage-study-v1",JSON.stringify({found,project}));notice="";return true}catch{notice=" This change will last only for this visit.";return false}}
function recap(id){$("recap").textContent=(id?messages[id]:"The shelf is waiting for its first discovery.")+notice}
function draw(){const pinned=ingredients[project]||[];order.forEach(id=>{const b=$(id),open=found.includes(id);b.className="token"+(open?"":" locked");b.disabled=!open;b.setAttribute("aria-label",open?id+" discovery":"Unknown discovery");b.setAttribute("aria-pressed",String(pinned.includes(id)))});$("find-reed").disabled=found.includes("reed");$("find-clay").disabled=!found.includes("reed")||found.includes("clay");$("find-glow").disabled=!found.includes("clay")||found.includes("glow");$("project-panel").hidden=!found.includes("glow");document.querySelectorAll("[data-project]").forEach(b=>b.setAttribute("aria-pressed",String(project===b.dataset.project)));if(project)$("project-status").textContent="Pinned: "+document.querySelector("[data-project="+project+"]").textContent.trim()}
function discover(id){if(found.includes(id))return;found.push(id);save();recap(id);draw()}
$("find-reed").onclick=()=>discover("reed");$("find-clay").onclick=()=>discover("clay");$("find-glow").onclick=()=>discover("glow");
order.forEach(id=>$(id).onclick=()=>recap(id));
document.querySelectorAll("[data-project]").forEach(b=>b.onclick=()=>{project=b.dataset.project;const ok=save();draw();if(!ok)$("project-status").textContent+=" · This choice will last only for this visit."});
$("reset").onclick=()=>{found=[];project="";notice="";try{localStorage.removeItem("blobz-cottage-study-v1")}catch{}recap("");$("project-status").textContent="Choose one outing. The others stay available.";draw()};paintTokens();draw();recap(found.at(-1)||"");
</script></html>
